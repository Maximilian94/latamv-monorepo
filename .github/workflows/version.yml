name: Automated Versioning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check conventional commits
      run: npx conventional-changelog-lint --from HEAD~1 --to HEAD

  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Install dependencies
      run: npm ci
    
    - name: Get current version
      id: current_version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Bump version
      id: bump_version
      run: |
        npm run version:patch
        echo "new_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Check if version changed
      id: version_changed
      run: |
        if [ "${{ steps.current_version.outputs.version }}" != "${{ steps.bump_version.outputs.new_version }}" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Push changes
      if: steps.version_changed.outputs.changed == 'true'
      run: |
        git push --follow-tags origin main
    
    - name: Create Release
      if: steps.version_changed.outputs.changed == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.bump_version.outputs.new_version }}
        release_name: Release v${{ steps.bump_version.outputs.new_version }}
        body: |
          ## What's Changed
          
          This is an automated release. See the [CHANGELOG.md](./CHANGELOG.md) for detailed information about what changed in this version.
          
          ## Version Information
          - **Version:** ${{ steps.bump_version.outputs.new_version }}
          - **Build Date:** ${{ github.event.head_commit.timestamp }}
          - **Commit:** ${{ github.sha }}
        draft: false
        prerelease: false 